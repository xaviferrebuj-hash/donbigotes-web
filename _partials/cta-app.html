<!-- ============================================================
     BLOQUE CTA  ->  PLANTILLA DE REFERENCIA. NO SE PUBLICA Y NO SE PROPAGA.

     🔴 Jekyll no publica directorios que empiezan por "_", y las paginas NO
     usan un include: cada una lleva su COPIA INLINE de este bloque. Editar
     este fichero NO cambia nada en produccion.

     Tocar el bloque = editarlo en las 19 copias inline + aqui, y despues
     regenerar los .md con tools/generar_md.py. Metodo e inventario en
     BARRIDO-1SEP.md. La regla 6 del CLAUDE.md lo llama "parcial reutilizable":
     reutilizable A MANO, no por include.

     Se conserva como referencia canonica para poder comparar si una pagina
     se desincroniza.

     Copia este bloque tal cual en cada pagina nueva. El <style> de
     abajo va INCLUIDO a proposito: el bloque tiene que renderizar
     bien aunque la pagina no traiga el CSS de la home.
     Los enlaces (webapp / playstore / appstore) se fijan desde
     /js/enlaces-app.js  (un solo sitio para editarlos).
     ============================================================ -->
<style>
/* CSS de soporte del CTA. Todo va colgado de #cta-app para que no pueda
   afectar a nada mas de la pagina. Las variables llevan valor de respaldo:
   si la pagina define --paper, --gold, etc., manda la pagina; si no, el
   bloque sigue viendose igual. Las paginas que ya traian estas reglas en su
   <style> propio no cambian: sus reglas van despues y ganan por orden. */
#cta-app{padding:clamp(56px,8vw,96px) 0;background:var(--paper,#FBF3E2);position:relative;overflow:hidden}
#cta-app .wrap{max-width:var(--max,1200px);margin:0 auto;padding:0 clamp(18px,4vw,26px)}
#cta-app .dl-wrap{text-align:center;max-width:680px;margin:0 auto}
#cta-app .eyebrow{display:inline-flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.72rem;color:var(--gold-soft,#B8861F);margin-bottom:18px}
#cta-app .dl-wrap h2{font-family:'Fraunces',Georgia,serif;font-weight:700;line-height:1.07;letter-spacing:-.01em;font-size:clamp(2rem,4.4vw,3rem);color:var(--ink,#3A2E22);margin-top:6px}
#cta-app .dl-wrap .lead{margin-top:14px;color:var(--ink-soft,#6B5A45);font-size:1.1rem}
#cta-app .btn-gold{display:inline-block;font-family:inherit;font-weight:800;font-size:1rem;cursor:pointer;padding:14px 26px;border-radius:12px;border:none;background:linear-gradient(180deg,var(--gold,#F2C14E),#E7B23B);color:var(--night-1,#0B1437);transition:transform .15s,box-shadow .15s;white-space:nowrap}
#cta-app .btn-gold:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(242,193,78,.42)}
#cta-app .badges{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:30px}
#cta-app .badge{display:inline-flex;align-items:center;gap:11px;background:#111;color:#fff;border-radius:13px;padding:11px 20px;text-decoration:none;min-width:200px}
#cta-app .badge .b-txt{text-align:left}
#cta-app .badge .b-top{font-size:.66rem;letter-spacing:.04em;opacity:.82;text-transform:uppercase}
#cta-app .badge .b-main{font-family:'Fraunces',serif;font-weight:600;font-size:1.18rem;line-height:1.05}
</style>
<section class="section cream-band cta-app" id="cta-app">
  <div class="wrap">
    <div class="dl-wrap">
      <span class="eyebrow">La app</span>
      <h2>Crea la experiencia completa en la app Don Bigotes</h2>
      <p class="lead">Voz, foto y Diploma de Valent&iacute;a personalizados. El Pack M&aacute;gico completo, 4,99 &euro; en un &uacute;nico pago.</p>
      <div class="badges" style="margin-bottom:18px">
        <a class="btn-gold" href="https://play.google.com/store/apps/details?id=es.donbigotes.app&referrer=utm_source%3Ddonbigotes.app%26utm_medium%3Dweb%26utm_campaign%3Dglobal" data-enlace="playstore" target="_blank" rel="noopener" style="min-width:240px;text-align:center;text-decoration:none">&#10024; Abrir la app ahora</a>
      </div>
      <div class="badges">
        <a href="https://play.google.com/store/apps/details?id=es.donbigotes.app&referrer=utm_source%3Ddonbigotes.app%26utm_medium%3Dweb%26utm_campaign%3Dglobal" target="_blank" rel="noopener"><img src="/assets/img/google-play-badge-es.png" alt="Disponible en Google Play" style="width:186px;height:72px"></a>
        <a href="https://apps.apple.com/es/app/id6798414411" data-enlace="appstore" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;justify-content:center;height:72px"><img src="/assets/img/app-store-badge-es.svg" alt="Cons&iacute;guelo en el App Store" width="165" height="55" style="width:165px;height:55px"></a>
      </div>
    </div>
  </div>
</section>
