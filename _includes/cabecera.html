{%- assign n = site.data.navegacion[include.lang] -%}
<div class="db-cab">
  <a class="db-marca" href="{{ n.home }}" aria-label="{{ n.marca_alt }}">
    <img src="/assets/img/logo-don-bigotes.jpg" alt="" width="44" height="44">
    <span>Don Bigotes</span>
  </a>
  <nav class="db-menu-ancho" aria-label="Principal">
    {%- for e in n.menu %}<a href="{{ e.url }}">{{ e.texto }}</a>{% endfor -%}
  </nav>
  <details class="db-menu-movil">
    <summary>{{ n.menu_etiqueta }}</summary>
    <nav aria-label="Principal">
      {%- for e in n.menu %}<a href="{{ e.url }}">{{ e.texto }}</a>{% endfor -%}
    </nav>
  </details>
</div>
